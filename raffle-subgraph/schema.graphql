# Raffle entity representing each raffle created
type Raffle @entity {
  id: Bytes! # raffleId as bytes
  raffleId: BigInt! # the actual raffle ID as number
  creator: User! # User entity reference
  prizeContract: Bytes! # address
  paymentToken: Bytes! # address (0x0 for ETH)
  winner: User # User entity reference - nullable until drawn
  prizeAmount: BigInt!
  ticketPrice: BigInt!
  prizeTokenId: BigInt!
  maxTicketsPerUser: BigInt!
  totalMaxTickets: BigInt!
  currentTickets: BigInt!
  endTime: BigInt!
  minTicketsNeededToDraw: BigInt!
  prizeType: Int! # 0=ERC20, 1=ERC721, 2=ERC1155
  status: Int! # 0=ACTIVE, 1=DRAWN, 2=CANCELLED, 3=REFUND_AVAILABLE
  whitelistNftContract: Bytes # NFT contract address for whitelist (null for open raffles)
  vrfRequestId: BigInt # VRF request ID
  createdAt: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
  
  # Relations
  tickets: [Ticket!]! @derivedFrom(field: "raffle")
  refunds: [Refund!]! @derivedFrom(field: "raffle")
}

# Ticket purchase entity
type Ticket @entity {
  id: Bytes! # transaction hash + log index
  raffle: Raffle!
  buyer: User! # User entity reference
  quantity: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Refund claim entity
type Refund @entity {
  id: Bytes! # transaction hash + log index
  raffle: Raffle!
  user: User! # User entity reference
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# User entity to track user activity
type User @entity {
  id: Bytes! # address
  totalRafflesCreated: BigInt!
  totalTicketsPurchased: BigInt!
  totalRefundsClaimed: BigInt!
  totalPrizesWon: BigInt!
  totalVolumeSpent: BigInt! # Total amount spent on tickets (in wei)
  totalVolumeEarned: BigInt! # Total amount earned from raffle sales (in wei)
  totalFeesGenerated: BigInt! # Total fees generated from their raffles (in wei)
  createdAt: BigInt!
  
  # Relations
  rafflesCreated: [Raffle!]! @derivedFrom(field: "creator")
  tickets: [Ticket!]! @derivedFrom(field: "buyer")
  refunds: [Refund!]! @derivedFrom(field: "user")
  rafflesWon: [Raffle!]! @derivedFrom(field: "winner")
}

# Global statistics
type GlobalStats @entity {
  id: Bytes! # singleton - always "global"
  totalRaffles: BigInt!
  totalTicketsSold: BigInt!
  totalValueLocked: BigInt! # in wei
  totalRefunds: BigInt!
  totalPrizesClaimed: BigInt!
  totalVolume: BigInt! # Total volume of all ticket sales (in wei)
  totalFeesGenerated: BigInt! # Total fees collected by the contract (in wei)
  totalCreatorEarnings: BigInt! # Total earnings distributed to raffle creators (in wei)
}

# Event entities for historical tracking
type RaffleCreatedEvent @entity {
  id: Bytes! # transaction hash + log index
  raffleId: BigInt!
  creator: Bytes!
  prizeContract: Bytes!
  prizeAmount: BigInt!
  whitelistNftContract: Bytes # NFT contract address for whitelist (null for open raffles)
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type RaffleDrawnEvent @entity {
  id: Bytes! # transaction hash + log index
  raffleId: BigInt!
  winner: Bytes!
  vrfRequestId: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type PrizeClaimedEvent @entity {
  id: Bytes! # transaction hash + log index
  raffleId: BigInt!
  winner: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type RaffleCancelledEvent @entity {
  id: Bytes! # transaction hash + log index
  raffleId: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type RefundAvailableEvent @entity {
  id: Bytes! # transaction hash + log index
  raffleId: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# Fee tracking entities
type FeeUpdatedEvent @entity {
  id: Bytes! # transaction hash + log index
  newFeePercentage: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type NFTContractWhitelistedEvent @entity {
  id: Bytes! # transaction hash + log index
  nftContract: Bytes!
  status: Boolean!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type VolumeSnapshot @entity {
  id: Bytes! # timestamp as bytes
  timestamp: BigInt!
  totalVolume: BigInt!
  totalFees: BigInt!
  totalTicketsSold: BigInt!
  totalRaffles: BigInt!
  blockNumber: BigInt!
}

# Leaderboard entities
type TopParticipant @entity {
  id: Bytes! # user address
  user: User!
  totalTicketsPurchased: BigInt!
  totalVolumeSpent: BigInt!
  rank: BigInt!
  lastUpdated: BigInt!
}

type TopWinner @entity {
  id: Bytes! # user address
  user: User!
  totalPrizesWon: BigInt!
  totalPrizeValue: BigInt! # Estimated total value of prizes won
  rank: BigInt!
  lastUpdated: BigInt!
}

type TopCreator @entity {
  id: Bytes! # user address
  user: User!
  totalRafflesCreated: BigInt!
  totalVolumeGenerated: BigInt! # Total volume from their raffles
  totalFeesGenerated: BigInt!
  rank: BigInt!
  lastUpdated: BigInt!
}

# Daily/Weekly/Monthly aggregates for analytics
type DailyVolume @entity {
  id: Bytes! # date as bytes (YYYY-MM-DD)
  date: BigInt! # timestamp of start of day
  volume: BigInt!
  fees: BigInt!
  ticketsSold: BigInt!
  rafflesCreated: BigInt!
  uniqueParticipants: BigInt!
}

type WeeklyVolume @entity {
  id: Bytes! # week start date as bytes
  weekStart: BigInt! # timestamp of start of week
  volume: BigInt!
  fees: BigInt!
  ticketsSold: BigInt!
  rafflesCreated: BigInt!
  uniqueParticipants: BigInt!
}

type MonthlyVolume @entity {
  id: Bytes! # month as bytes (YYYY-MM)
  monthStart: BigInt! # timestamp of start of month
  volume: BigInt!
  fees: BigInt!
  ticketsSold: BigInt!
  rafflesCreated: BigInt!
  uniqueParticipants: BigInt!
}
