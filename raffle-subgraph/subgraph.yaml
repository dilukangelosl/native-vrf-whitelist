specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: RaffleOnApe
    network: apechain
    source:
      address: "0xd991b048c0618BbeE00d5B0F3c4CE8Ecb661D8c1"
      abi: RaffleOnApe
      startBlock: 17338536 # You may want to update this to the actual deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Raffle
        - Ticket
        - Refund
        - User
        - GlobalStats
        - RaffleCreatedEvent
        - RaffleDrawnEvent
        - PrizeClaimedEvent
        - RaffleCancelledEvent
        - RefundAvailableEvent
        - FeeUpdatedEvent
        - NFTContractWhitelistedEvent
        - VolumeSnapshot
        - TopParticipant
        - TopWinner
        - TopCreator
        - DailyVolume
        - WeeklyVolume
        - MonthlyVolume
      abis:
        - name: RaffleOnApe
          file: ./abis/RaffleOnApe.json
      eventHandlers:
        - event: RaffleCreated(indexed uint256,indexed address,address,uint256,address)
          handler: handleRaffleCreated
        - event: TicketPurchased(indexed uint256,indexed address,uint32)
          handler: handleTicketPurchased
        - event: RaffleDrawn(indexed uint256,indexed address,uint256)
          handler: handleRaffleDrawn
        - event: PrizeClaimed(indexed uint256,indexed address)
          handler: handlePrizeClaimed
        - event: RaffleCancelled(indexed uint256)
          handler: handleRaffleCancelled
        - event: RefundAvailable(indexed uint256)
          handler: handleRefundAvailable
        - event: RefundClaimed(indexed uint256,indexed address,uint256)
          handler: handleRefundClaimed
        - event: FeeUpdated(uint256)
          handler: handleFeeUpdated
        - event: NativeVRFUpdated(indexed address,indexed address)
          handler: handleNativeVRFUpdated
        - event: NFTContractWhitelisted(indexed address,bool)
          handler: handleNFTContractWhitelisted
      file: ./src/raffle-on-ape.ts
